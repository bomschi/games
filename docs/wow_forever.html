<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WoW Forever – Wiki</title>
<style>
:root{
  --bg:#040f1a;
  --panel:#091a2b;
  --panel2:#09273e;
  --border:#1a3658;
  --text:#f3eee2;
  --muted:#52749a;
  --teal:#00afd7;
  --teal-soft:#0093b2;
  --gold:#f8b700;
  --gold-soft:#c76700;
  --shadow:0 18px 55px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:radial-gradient(circle at 50% -10%,#114f72 0,transparent 45%),var(--bg);
  color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
}
.wrap{max-width:860px;margin:auto;padding:32px 24px 24px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}
.brand{
  font-family:Georgia,"Palatino Linotype",serif;
  font-size:clamp(32px,5vw,52px);
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  line-height:1.1;
}
.brand span{
  background:linear-gradient(180deg,#8fe6ff 0%,var(--teal) 55%,var(--teal-soft) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.small{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:48ch}
.wiki-badge{
  flex-shrink:0;margin-top:6px;
  padding:8px 14px;border-radius:999px;
  border:1px solid var(--teal-soft);
  color:var(--teal);
  font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(0,175,215,.14),transparent);
}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.pill{
  display:inline-block;padding:9px 16px;border-radius:999px;
  border:1px solid var(--border);background:var(--panel2);
  color:var(--text);font-weight:700;font-size:14px;text-decoration:none;
  transition:.18s border-color,.18s color,.18s transform;
}
.pill:hover{border-color:var(--teal-soft);color:var(--teal);transform:translateY(-1px)}
.card{
  background:linear-gradient(180deg,rgba(0,175,215,.06),transparent 60%),var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  box-shadow:inset 0 0 0 1px rgba(0,175,215,.08),inset 0 1px 0 rgba(255,255,255,.04),var(--shadow);
}
.card h2{
  font-family:Georgia,"Palatino Linotype",serif;
  font-size:26px;font-weight:900;letter-spacing:.5px;
  margin:0 0 6px;color:var(--teal);
}
.card .intro{margin:0 0 18px;color:var(--muted);font-size:14px}
ul.items{list-style:none;margin:0;padding:0;column-count:2;column-gap:24px;position:relative}
ul.items::before{
  content:"";position:absolute;top:8px;bottom:8px;left:50%;width:1px;
  background:#0d2438;
}
ul.items li{
  display:flex;align-items:center;gap:12px;
  padding:8px;border-radius:8px;break-inside:avoid;
  transition:.15s background;
}
ul.items li:hover{background:rgba(0,175,215,.07)}
.icon{
  flex-shrink:0;width:40px;height:40px;border-radius:11px;
  background:var(--panel2);border:1px solid var(--border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.icon img{width:100%;height:100%;object-fit:contain;padding:5px;border-radius:8px}
.name{font-weight:650}
.price{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.price .g{
  color:var(--gold);
  background:linear-gradient(180deg,#fff7c6 0%,var(--gold) 60%,var(--gold-soft) 100%);
  -webkit-background-clip:text;background-clip:text;
}
.price .s{
  color:#c2cad6;
  background:linear-gradient(180deg,#eef2f7 0%,#c2cad6 60%,#8b9bad 100%);
  -webkit-background-clip:text;background-clip:text;
}
.legend{margin:14px 0 0;color:var(--muted);font-size:12.5px;text-align:right}
.footer{margin:22px 0 6px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:560px){
  header{flex-direction:column-reverse;align-items:flex-start}
  .card{padding:18px}
  ul.items{column-count:1}
  ul.items::before{content:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="brand">WOW <span>FOREVER</span></div>
  </div>
  <div class="wiki-badge">📜 Wiki</div>
</header>

<section id="investitionen" class="card">
  <h2>📦 Investitionen</h2>
  <ul class="items">
    <li><span class="icon"><img src="static/wow_icons/04_potion_potion.png" alt="FAP"></span><span class="name">FAP</span><span class="price"><span class="s">6s</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/95_potion_potion.png" alt="Swiftness Potion"></span><span class="name">Swiftness Potion</span><span class="price"><span class="s">5s</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/Herb_04.png" alt="Flitzdistel"></span><span class="name">Flitzdistel</span><span class="price"><span class="s">6s</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/27_BlueSoup.png" alt="Nachflossensuppe"></span><span class="name">Nachflossensuppe</span><span class="price"><span class="s">10s</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/Food_53.png" alt="Chili"></span><span class="name">Chili</span><span class="price"><span class="s">15-20s</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/WeaponScroll03.png" alt="Scrolls III"></span><span class="name">Scrolls III</span><span class="price"><span class="s">11s</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/FormulaGood_01.png" alt="Flask Rezept"></span><span class="name">Flask Rezept</span><span class="price"><span class="g">50g</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/55_potion_potion.png" alt="Flask"></span><span class="name">Flask</span><span class="price"><span class="g">20g</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/29_potion_potion.png" alt="Elixier Mungo"></span><span class="name">Mungo</span><span class="price"><span class="s">80s</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/08_potion_potion.png" alt="Elixier Grizzly"></span><span class="name">Grizzly</span><span class="price"><span class="g">1g</span> <span class="s">10s</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/120_potion_potion.png" alt="Trank Raserei"></span><span class="name">Trank Raserei</span><span class="price"><span class="g">1g</span> <span class="s">50s</span></span></li>
    <li><span class="icon"><img src="static/wow_icons/Ticket_Tarot_Elemental_01.png" alt="Elementar Card"></span><span class="name">Elementar Card</span><span class="price"><span class="g">50g</span></span></li>
  </ul>
</section>

</body>
</html>
